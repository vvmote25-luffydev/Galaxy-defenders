<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC PAGE SETTINGS
         ===================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Galaxy Defender - Retro Arcade Space Shooter"
    >

    <title>🚀 Galaxy Defender</title>


    <!-- =====================================================
         STYLESHEET
         ===================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         MAIN GAME CONTAINER
         ===================================================== -->

    <main id="game">


        <!-- =================================================
             TOP HUD
             ================================================= -->

        <header class="hud">


            <!-- SCORE -->

            <div class="hud-box">

                <span class="label">
                    SCORE
                </span>

                <span id="score">
                    000000
                </span>

            </div>


            <!-- GAME TITLE -->

            <div class="title">

                <div class="title-main">
                    GALAXY
                </div>

                <div class="title-sub">
                    DEFENDER
                </div>

                <div class="mission">
                    DESTROY THEM ALL!
                </div>

            </div>


            <!-- LIVES -->

            <div class="hud-box lives">

                <span class="label">
                    LIVES
                </span>

                <span id="lives">
                    ♥ ♥ ♥
                </span>

            </div>

        </header>



        <!-- =================================================
             GAME CANVAS

             IMPORTANT:
             Do NOT add width="800" or height="600".
             JavaScript automatically makes this fullscreen.
             ================================================= -->

        <canvas id="gameCanvas"></canvas>



        <!-- =================================================
             START SCREEN
             ================================================= -->

        <section
            id="startScreen"
            class="overlay"
        >

            <div class="arcade-panel">


                <!-- TITLE -->

                <div class="panel-title">
                    GALAXY DEFENDER
                </div>


                <!-- MESSAGE -->

                <p>
                    THE GALAXY NEEDS YOU, PILOT!
                </p>


                <!-- CONTROLS -->

                <div class="controls">


                    <div>

                        <kbd>←</kbd>

                        <kbd>→</kbd>

                        MOVE

                    </div>


                    <div>

                        <kbd>SPACE</kbd>

                        SHOOT

                    </div>

                </div>


                <!-- START BUTTON -->

                <button
                    id="startButton"
                    type="button"
                    onclick="startGame()"
                >

                    ▶ START GAME

                </button>

            </div>

        </section>



        <!-- =================================================
             GAME OVER SCREEN
             ================================================= -->

        <section
            id="gameOver"
            class="overlay hidden"
        >

            <div class="arcade-panel">


                <!-- GAME OVER TITLE -->

                <div class="game-over-title">
                    GAME OVER
                </div>


                <!-- SCORE LABEL -->

                <p>
                    YOUR SCORE
                </p>


                <!-- FINAL SCORE -->

                <div id="finalScore">
                    000000
                </div>


                <!-- RESTART BUTTON -->

                <button
                    id="restartButton"
                    type="button"
                    onclick="restartGame()"
                >

                    ▶ PLAY AGAIN

                </button>

            </div>

        </section>



        <!-- =================================================
             BOTTOM CONTROL INFORMATION
             ================================================= -->

        <footer class="bottom-info">


            <div>

                <span>◀</span>
                <span>▶</span>

                MOVE

            </div>


            <div>

                <span>SPACE</span>

                SHOOT

            </div>


            <div>

                GOOD LUCK, PILOT!

            </div>

        </footer>


    </main>



    <!-- =====================================================
         JAVASCRIPT
         
         IMPORTANT:
         Keep this at the bottom so the HTML elements
         exist before game.js tries to access them.
         ===================================================== -->

    <script src="game.js"></script>

</body>

</html>
